services:
  reader-frontend:
    build: ./reader-frontend
    volumes:
      - ./reader-frontend:/app:delegated
      - /app/node_modules
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
       - CHOKIDAR_USEPOLLING=true
  redis:
    image: redis:alpine
    container_name: reader-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
volumes:
  node_modules:
  redis-data: