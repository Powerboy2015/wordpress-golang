services:

# NGINX Routing
  nignx:
    image: "nginx"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
    - "4000:4000"
    depends_on:
      - net-api
      - reader-frontend
  net-api:
    build:
      context: ./net-api/App
    ports:
      - "8080:8080"

# Frontend Node.js REACT
  reader-frontend:
    build: 
      context: ./reader-frontend
      target: dev
    volumes:
      - ./reader-frontend:/app:delegated
      - /app/node_modules
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
       - CHOKIDAR_USEPOLLING=true

# Database for caching
  redis:
    image: redis:alpine
    container_name: reader-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
volumes:
  node_modules:
  redis-data: